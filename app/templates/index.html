<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipe Vault</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <h1>Recipe Vault</h1>
    </header>

    <main class="container">
        <section class="filters">
            <div class="filter-field">
                <label for="protein-select">Protein</label>
                <select id="protein-select"></select>
            </div>
            <div class="filter-field">
                <label for="genre-select">Genre</label>
                <select id="genre-select"></select>
            </div>
        </section>

        <section class="actions">
            <button id="random-btn" class="btn btn-primary">Random recipe</button>
            <button id="another-btn" class="btn btn-secondary hidden">Another one</button>
        </section>

        <section class="result">
            <p id="empty-state" class="empty-state hidden"></p>
            <article id="recipe-card" class="recipe-card hidden"></article>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
