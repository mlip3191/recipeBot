services:
  recipes:
    build: .
    environment:
      - PORT=${PORT:-8000}
      - DATABASE_URL=${DATABASE_URL:-}
    expose:
      - "8000"
    volumes:
      - recipe_data:/data
      - ./backups:/backups
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - recipes

volumes:
  recipe_data:
